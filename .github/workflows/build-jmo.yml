name: Build the jamovi module (.jmo)

# Builds EGAnetLab_<version>.jmo for Windows on a GitHub machine, so a release
# does not depend on a local computer. Run it by hand from the Actions tab
# (Run workflow); the .jmo is attached to the run as an artifact. With
# "Publish the release" ticked, it also creates the release v<version> on
# main with the .jmo and the version's section of NEWS.md as notes.
# ES: Compila EGAnetLab_<versión>.jmo para Windows en una máquina de GitHub,
# para que una release no dependa de un equipo local. Se ejecuta a mano desde
# la pestaña Actions (Run workflow); el .jmo queda adjunto a la ejecución
# como artefacto. Si se marca "Publish the release", también crea la release
# v<versión> sobre main con el .jmo y la sección de la versión en NEWS.md
# como notas.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the release
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/build-jmo.yml

jobs:
  build-windows:
    runs-on: windows-2025
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # The packages must be built with the same R minor version that jamovi
      # bundles (jamovi 2.7 uses R 4.5). A .jmo built with another R version
      # is rejected by jamovi ("needs to be updated"). Change this when
      # jamovi moves to a new R version.
      # ES: Los paquetes deben compilarse con la misma versión menor de R que
      # trae jamovi (jamovi 2.7 usa R 4.5). jamovi rechaza un .jmo compilado
      # con otra versión de R ("debe actualizarse"). Cambiar esto cuando
      # jamovi pase a otra versión de R.
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.0'

      # jamovi itself is needed: the module is compiled against the R that
      # jamovi bundles.
      # ES: Hace falta jamovi: el módulo se compila con el R que trae jamovi.
      - name: Install jamovi
        shell: pwsh
        run: |
          winget install --id Jamovi.Desktop.Current --exact --silent --scope machine --accept-package-agreements --accept-source-agreements --disable-interactivity
          $home_dir = Get-ChildItem 'C:\Program Files' -Directory -Filter 'jamovi*' | Select-Object -First 1
          if (-not $home_dir) { throw 'jamovi was not installed' }
          Write-Host "jamovi home: $($home_dir.FullName)"
          "JAMOVI_HOME=$($home_dir.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install jmvtools
        shell: pwsh
        run: Rscript -e "install.packages('jmvtools', repos = c('https://repo.jamovi.org', 'https://cloud.r-project.org'))"

      - name: Build the .jmo
        shell: pwsh
        run: |
          Rscript -e "jmvtools::install(home = Sys.getenv('JAMOVI_HOME'))"
          Get-ChildItem *.jmo
          if (-not (Get-ChildItem EGAnetLab_*.jmo)) { throw 'no .jmo was built' }

      - name: Upload the .jmo
        uses: actions/upload-artifact@v4
        with:
          name: EGAnetLab-jmo-windows
          path: EGAnetLab_*.jmo
          if-no-files-found: error

      # Only from main, by hand, with the box ticked.
      # ES: Solo desde main, a mano y con la casilla marcada.
      - name: Publish the release
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Select-String -Path DESCRIPTION -Pattern '^Version:\s*(.+)$').Matches[0].Groups[1].Value.Trim()
          $news = Get-Content NEWS.md -Encoding utf8
          $start = ($news | Select-String -Pattern "^# EGAnetLab $([regex]::Escape($version))\b").LineNumber
          if (-not $start) { throw "NEWS.md has no section for $version" }
          $rest = $news[$start..($news.Length - 1)]
          $next = ($rest | Select-String -Pattern '^# EGAnetLab ' | Select-Object -First 1).LineNumber
          $body = if ($next) { $rest[0..($next - 2)] } else { $rest }
          $intro = "Install: download EGAnetLab_$version.jmo below (Windows), then in jamovi open ⋮ › Modules › Install from file.", ""
          ($intro + $body) | Out-File notes.md -Encoding utf8
          gh release create "v$version" "EGAnetLab_$version.jmo" --target main --title "EGAnetLab $version" --notes-file notes.md
