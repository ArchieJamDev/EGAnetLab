name: Build the jamovi module (.jmo)

# Builds EGAnetLab_<version>.jmo for Windows on a GitHub machine, so a release
# does not depend on a local computer. Run it by hand from the Actions tab
# (Run workflow); the .jmo is attached to the run as an artifact.
# ES: Compila EGAnetLab_<versión>.jmo para Windows en una máquina de GitHub,
# para que una release no dependa de un equipo local. Se ejecuta a mano desde
# la pestaña Actions (Run workflow); el .jmo queda adjunto a la ejecución
# como artefacto.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/build-jmo.yml

jobs:
  build-windows:
    runs-on: windows-2025
    timeout-minutes: 90

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      # jamovi itself is needed: the module is compiled against the R that
      # jamovi bundles.
      # ES: Hace falta jamovi: el módulo se compila con el R que trae jamovi.
      - name: Install jamovi
        shell: pwsh
        run: |
          winget install --id Jamovi.Desktop.Current --exact --silent --scope machine --accept-package-agreements --accept-source-agreements --disable-interactivity
          $home_dir = Get-ChildItem 'C:\Program Files' -Directory -Filter 'jamovi*' | Select-Object -First 1
          if (-not $home_dir) { throw 'jamovi was not installed' }
          Write-Host "jamovi home: $($home_dir.FullName)"
          "JAMOVI_HOME=$($home_dir.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install jmvtools
        shell: pwsh
        run: Rscript -e "install.packages('jmvtools', repos = c('https://repo.jamovi.org', 'https://cloud.r-project.org'))"

      - name: Build the .jmo
        shell: pwsh
        run: |
          Rscript -e "jmvtools::install(home = Sys.getenv('JAMOVI_HOME'))"
          Get-ChildItem *.jmo
          if (-not (Get-ChildItem EGAnetLab_*.jmo)) { throw 'no .jmo was built' }

      - name: Upload the .jmo
        uses: actions/upload-artifact@v4
        with:
          name: EGAnetLab-jmo-windows
          path: EGAnetLab_*.jmo
          if-no-files-found: error
