name: ega
title: Exploratory Graph Analysis
menuGroup: EGAnet Lab
menuSubgroup: Dimensionality
menuTitle: Exploratory Graph Analysis
version: '0.1.0'
jas: '1.2'

description:
    main: >
      Estimates the number of dimensions underlying a set of items, and which
      items belong to each dimension, with Exploratory Graph Analysis (EGAnet),
      paired with network loadings, entropy fit and plain-language
      interpretation.

options:
  - name: data
    type: Data

  # The items whose dimensional structure is estimated. EGA needs at least
  # three; the .b.R file rejects fewer (Category A).
  # ES: Los ítems cuya estructura dimensional se estima. EGA necesita al menos
  # tres; el .b.R rechaza menos (Categoría A).
  - name: vars
    title: Items
    type: Variables
    suggested:
      - continuous
      - ordinal
    permitted:
      - numeric

  - name: reportLang
    title: Report Language
    type: List
    options:
      - title: English
        name: en
      - title: Español
        name: es
    default: en

  # Correlation passed to EGAnet::EGA(corr =). "auto" lets EGAnet choose
  # polychoric/tetrachoric correlations for items with few categories; the
  # report states which items triggered that choice.
  # ES: Correlación pasada a EGAnet::EGA(corr =). "auto" deja que EGAnet elija
  # correlaciones policóricas/tetracóricas para ítems con pocas categorías;
  # el informe indica qué ítems motivaron esa elección.
  - name: corr
    title: Correlation
    type: List
    options:
      - title: Automatic (Pearson / polychoric)
        name: auto
      - title: Pearson
        name: pearson
      - title: Spearman
        name: spearman
      - title: Cosine
        name: cosine
    default: auto

  - name: naData
    title: Missing Values
    type: List
    options:
      - title: Pairwise
        name: pairwise
      - title: Listwise
        name: listwise
    default: pairwise

  - name: model
    title: Network Model
    type: List
    options:
      - title: GLASSO (EBIC)
        name: glasso
      - title: TMFG
        name: TMFG
      - title: BGGM
        name: BGGM
    default: glasso

  - name: algorithm
    title: Community Detection
    type: List
    options:
      - title: Walktrap
        name: walktrap
      - title: Louvain
        name: louvain
      - title: Leiden
        name: leiden
    default: walktrap

  - name: uniMethod
    title: Unidimensionality Check
    type: List
    options:
      - title: Louvain
        name: louvain
      - title: Expand
        name: expand
      - title: Leading eigenvalue
        name: LE
    default: louvain

  - name: showLoadings
    title: Network loadings
    type: Bool
    default: true

  - name: showNetworkPlot
    title: Network plot
    type: Bool
    default: true

  # Same policy as AssumptionsLab's plotPalette, adapted: EGAnet draws its
  # own network plot with a manual color scale, so "default" keeps EGAnet's
  # palette and the other two are colorblind-safe additions.
  # ES: Misma política que plotPalette de AssumptionsLab, adaptada: EGAnet
  # dibuja su propio gráfico de red con escala de color manual, así que
  # "default" conserva la paleta de EGAnet y las otras dos son añadidos
  # aptos para daltonismo.
  - name: plotPalette
    title: Dimension Colors
    type: List
    options:
      - title: EGAnet default
        name: default
      - title: Colorblind-safe (Okabe-Ito)
        name: colorblind
      - title: Viridis
        name: viridis
    default: default
...
