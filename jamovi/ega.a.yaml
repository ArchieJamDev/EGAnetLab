name: ega
title: Exploratory Graph Analysis
menuGroup: EGAnet Lab
menuSubgroup: Dimensionality
menuTitle: Exploratory Graph Analysis
version: '0.1.0'
jas: '1.2'

description:
    main: >
      Estimates the number of dimensions underlying a set of items, and which
      items belong to each dimension, with Exploratory Graph Analysis (EGAnet),
      paired with network loadings, entropy fit, optional bootstrap stability
      of dimensions and items, optional redundancy analysis (UVA), and
      plain-language interpretation.

options:
  - name: data
    type: Data

  # The items whose dimensional structure is estimated. EGA needs at least
  # three; the .b.R file rejects fewer (Category A).
  # ES: Los ítems cuya estructura dimensional se estima. EGA necesita al menos
  # tres; el .b.R rechaza menos (Categoría A).
  - name: vars
    title: Items
    type: Variables
    suggested:
      - continuous
      - ordinal
    permitted:
      - numeric

  - name: reportLang
    title: Report Language
    type: List
    options:
      - title: English
        name: en
      - title: Español
        name: es
    default: en

  # Correlation passed to EGAnet::EGA(corr =). "auto" lets EGAnet choose
  # polychoric/tetrachoric correlations for items with few categories; the
  # report states which items triggered that choice.
  # ES: Correlación pasada a EGAnet::EGA(corr =). "auto" deja que EGAnet elija
  # correlaciones policóricas/tetracóricas para ítems con pocas categorías;
  # el informe indica qué ítems motivaron esa elección.
  - name: corr
    title: Correlation
    type: List
    options:
      - title: Automatic (Pearson / polychoric)
        name: auto
      - title: Pearson
        name: pearson
      - title: Spearman
        name: spearman
      - title: Cosine
        name: cosine
    default: auto

  - name: naData
    title: Missing Values
    type: List
    options:
      - title: Pairwise
        name: pairwise
      - title: Listwise
        name: listwise
    default: pairwise

  - name: model
    title: Network Model
    type: List
    options:
      - title: GLASSO (EBIC)
        name: glasso
      - title: TMFG
        name: TMFG
      - title: BGGM
        name: BGGM
    default: glasso

  - name: algorithm
    title: Community Detection
    type: List
    options:
      - title: Walktrap
        name: walktrap
      - title: Louvain
        name: louvain
      - title: Leiden
        name: leiden
    default: walktrap

  - name: uniMethod
    title: Unidimensionality Check
    type: List
    options:
      - title: Louvain
        name: louvain
      - title: Expand
        name: expand
      - title: Leading eigenvalue
        name: LE
    default: louvain

  # ---------------------------------------------------------------------------
  # Stability (bootstrap): an optional section of this analysis, so it always
  # resamples the same estimation the user sees above (EGAnet::bootEGA()).
  # Resampling takes minutes, so nothing runs until the user ticks "Run
  # bootstrap" (ARCHITECTURE.md §16). The seed is visible and fixed by
  # default so every result can be reproduced.
  # ES: Estabilidad (bootstrap): una sección opcional de este análisis, para
  # que siempre remuestree la misma estimación que el usuario ve arriba
  # (EGAnet::bootEGA()). El remuestreo tarda minutos, así que nada se ejecuta
  # hasta que el usuario marca "Run bootstrap" (ARCHITECTURE.md §16). La
  # semilla es visible y fija por defecto para que todo resultado sea
  # reproducible.
  # ---------------------------------------------------------------------------
  - name: runBoot
    title: Run bootstrap
    type: Bool
    default: false

  - name: bootType
    title: Bootstrap type
    type: List
    options:
      - title: Parametric
        name: parametric
      - title: Resampling (cases)
        name: resampling
    default: parametric

  - name: iter
    title: Bootstrap samples
    type: Integer
    min: 10
    max: 10000
    default: 500

  - name: seed
    title: Seed
    type: Integer
    min: 1
    max: 999999999
    default: 2026

  # Item stability below this proportion is flagged in the item table, the
  # plot and the interpretation.
  # ES: La estabilidad de ítem menor a esta proporción se señala en la tabla
  # de ítems, el gráfico y la interpretación.
  - name: stabilityCut
    title: Item stability cutoff
    type: Number
    min: 0.5
    max: 0.95
    default: 0.7

  - name: showItemPlot
    title: Item stability plot
    type: Bool
    default: true

  - name: showFrequencyPlot
    title: Dimension frequency plot
    type: Bool
    default: true

  # ---------------------------------------------------------------------------
  # Redundancy (UVA): optional section that runs EGAnet::UVA() with the same
  # estimation options. Pairs of items whose weighted topological overlap
  # (wTO) reaches the cutoff are flagged as locally dependent; .25 is the
  # value recommended by Christensen, Garrido and Golino (2023).
  # ES: Redundancia (UVA): sección opcional que ejecuta EGAnet::UVA() con las
  # mismas opciones de estimación. Los pares de ítems cuyo solapamiento
  # topológico ponderado (wTO) alcanza el punto de corte se señalan como
  # localmente dependientes; .25 es el valor recomendado por Christensen,
  # Garrido y Golino (2023).
  # ---------------------------------------------------------------------------
  - name: runUVA
    title: Check redundancy (UVA)
    type: Bool
    default: false

  - name: uvaCut
    title: Redundancy cutoff (wTO)
    type: Number
    min: 0.15
    max: 0.40
    default: 0.25

  # ---------------------------------------------------------------------------
  # Network scores (EGAnet::net.scores()): one score per person and
  # dimension, weighted by the network loadings. The table summarizes them;
  # the Output option saves them as new columns of the dataset.
  # ES: Puntuaciones de red (EGAnet::net.scores()): una puntuación por
  # persona y dimensión, ponderada por las cargas de red. La tabla las
  # resume; la opción Output las guarda como columnas nuevas del conjunto de
  # datos.
  # ---------------------------------------------------------------------------
  - name: netScores
    title: Network scores summary
    type: Bool
    default: false

  - name: netScoresOV
    title: Save network scores
    type: Output

  # Explanatory paragraph for each estimation choice currently selected
  # (Archie's design rule: every menu decision carries its explanation).
  # ES: Párrafo explicativo para cada elección de estimación seleccionada
  # (regla de diseño de Archie: cada decisión del menú lleva su explicación).
  - name: showChoicesGuide
    title: Explain my choices
    type: Bool
    default: true

  - name: showLoadings
    title: Network loadings
    type: Bool
    default: true

  - name: showNetworkPlot
    title: Network plot
    type: Bool
    default: true

  # Same policy as AssumptionsLab's plotPalette, adapted: EGAnet draws its
  # own network plot with a manual color scale, so "default" keeps EGAnet's
  # palette and the other two are colorblind-safe additions.
  # ES: Misma política que plotPalette de AssumptionsLab, adaptada: EGAnet
  # dibuja su propio gráfico de red con escala de color manual, así que
  # "default" conserva la paleta de EGAnet y las otras dos son añadidos
  # aptos para daltonismo.
  - name: plotPalette
    title: Dimension Colors
    type: List
    options:
      - title: EGAnet default
        name: default
      - title: Colorblind-safe (Okabe-Ito)
        name: colorblind
      - title: Viridis
        name: viridis
    default: default

  # ---------------------------------------------------------------------------
  # Network plot customization. Defaults equal EGAnet's own plot.EGA()
  # defaults, so an untouched analysis draws the same plot as EGAnet. Every
  # option maps to a GGally::ggnet2 argument that plot.EGA() forwards
  # (ARCHITECTURE.md §10), except edgeMin and the edge labels, which
  # EGAnetLab applies itself.
  # ES: Personalización del gráfico de red. Los valores por defecto son los
  # de plot.EGA() de EGAnet, así que un análisis sin tocar dibuja el mismo
  # gráfico que EGAnet. Cada opción corresponde a un argumento de
  # GGally::ggnet2 que plot.EGA() reenvía (ARCHITECTURE.md §10), salvo
  # edgeMin y las etiquetas de aristas, que aplica EGAnetLab.
  # ---------------------------------------------------------------------------
  - name: layout
    title: Layout
    type: List
    options:
      - title: Spring (Fruchterman-Reingold)
        name: qgraph
      - title: Kamada-Kawai
        name: kamadakawai
      - title: Circle
        name: circle
      - title: Multidimensional scaling
        name: mds
      - title: Eigenvector
        name: eigen
    default: qgraph

  - name: plotTitle
    title: Plot title
    type: String
    default: ''

  - name: nodeSize
    title: Node size
    type: Number
    min: 2
    max: 30
    default: 12

  - name: nodeShape
    title: Node shape
    type: List
    options:
      - title: Circle
        name: circle
      - title: Square
        name: square
      - title: Triangle
        name: triangle
      - title: Diamond
        name: diamond
    default: circle

  - name: nodeAlpha
    title: Node fill opacity
    type: Number
    min: 0
    max: 1
    default: 0.5

  - name: labelSize
    title: Label size
    type: Number
    min: 1
    max: 15
    default: 5

  - name: labelColor
    title: Label color
    type: List
    options:
      - title: Black
        name: black
      - title: Dark gray
        name: grey30
      - title: Navy
        name: navy
      - title: White
        name: white
    default: black

  - name: edgeSize
    title: Edge width
    type: Number
    min: 1
    max: 20
    default: 8

  - name: edgePosColor
    title: Positive edges
    type: List
    options:
      - title: Dark green
        name: darkgreen
      - title: Blue
        name: blue
      - title: Black
        name: black
      - title: Gray
        name: grey50
    default: darkgreen

  - name: edgeNegColor
    title: Negative edges
    type: List
    options:
      - title: Red
        name: red
      - title: Orange
        name: orange
      - title: Dark red
        name: darkred
      - title: Gray
        name: grey50
    default: red

  - name: edgeNegLty
    title: Negative edge line
    type: List
    options:
      - title: Solid
        name: solid
      - title: Dashed
        name: dashed
      - title: Dotted
        name: dotted
    default: solid

  # Edges whose absolute weight is below this value are hidden from the
  # plot only; the estimated network, memberships and loadings are not
  # changed.
  # ES: Las aristas con peso absoluto menor a este valor se ocultan solo en
  # el gráfico; la red estimada, las pertenencias y las cargas no cambian.
  - name: edgeMin
    title: Hide edges weaker than
    type: Number
    min: 0
    max: 1
    default: 0

  - name: showEdgeLabels
    title: Show edge weights
    type: Bool
    default: false

  - name: edgeLabelSize
    title: Edge weight size
    type: Number
    min: 1
    max: 10
    default: 3

  - name: edgeLabelDigits
    title: Decimals
    type: Integer
    min: 1
    max: 3
    default: 2

  - name: showLegend
    title: Show legend
    type: Bool
    default: true

  - name: legendPosition
    title: Legend position
    type: List
    options:
      - title: Right
        name: right
      - title: Bottom
        name: bottom
      - title: Left
        name: left
      - title: Top
        name: top
    default: right

  - name: legendTitle
    title: Legend title
    type: String
    default: ''
...
