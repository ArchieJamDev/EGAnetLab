title: Exploratory Graph Analysis
name: ega
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Items
        children:
          - type: VariablesListBox
            name: vars
            isTarget: true
  - type: CollapseBox
    label: Report Language
    collapsed: false
    children:
      - type: ComboBox
        name: reportLang
  - type: CollapseBox
    label: Estimation
    collapsed: true
    children:
      - type: ComboBox
        name: corr
      - type: ComboBox
        name: naData
      - type: ComboBox
        name: model
      - type: ComboBox
        name: algorithm
      - type: ComboBox
        name: uniMethod
  - type: CollapseBox
    label: Negatively worded items
    collapsed: true
    children:
      - type: VariableSupplier
        persistentItems: true
        stretchFactor: 1
        suggested:
          - continuous
          - ordinal
        permitted:
          - numeric
        children:
          - type: TargetLayoutBox
            label: Negatively worded items
            children:
              - type: VariablesListBox
                name: negItems
                isTarget: true
                height: small
      - type: ComboBox
        name: negCoding
      - type: Label
        label: >-
          If they are as answered, every analysis reverses them (observed
          minimum plus maximum, minus the score). Random-intercept EGA always
          uses them in their original direction.
  - type: CollapseBox
    label: Network scores
    collapsed: true
    children:
      - type: CheckBox
        name: netScores
      - type: Output
        name: netScoresOV
      - type: Output
        name: meanScoresOV
  - type: CollapseBox
    label: Compare structures (TEFI)
    collapsed: true
    children:
      - type: CheckBox
        name: runCompare
      - type: CheckBox
        name: compareAlgorithms
        enable: (runCompare)
      - type: VariableSupplier
        persistentItems: true
        stretchFactor: 1
        suggested:
          - continuous
          - ordinal
        permitted:
          - numeric
        children:
          - type: TargetLayoutBox
            label: Theoretical structure
            children:
              - type: ListBox
                name: theoryFactors
                height: large
                addButton: Add New Factor
                enable: (runCompare)
                events:
                  listItemAdded: './ega.events::onFactorsChanged'
                  listItemRemoved: './ega.events::onFactorsChanged'
                templateName: linreg-block-template
                template:
                  type: LayoutBox
                  margin: normal
                  children:
                    - type: TextBox
                      valueKey:
                        - label
                      borderless: true
                      name: blockName
                      stretchFactor: 1
                      margin: normal
                      events:
                        change: './ega.events::onFactorsChanged'
                    - type: VariablesListBox
                      valueFilter: unique
                      valueKey:
                        - vars
                      name: blockList
                      isTarget: true
                      height: auto
                      ghostText: drag variables here
      - type: CheckBox
        name: compareCFA
        enable: (runCompare)
  - type: CollapseBox
    label: Hierarchical and wording structure
    collapsed: true
    children:
      - type: CheckBox
        name: runHier
      - type: CheckBox
        name: runRI
      - type: Label
        label: >-
          Only for scales that mix positively and negatively worded items.
          Mark the negative items in the Negatively worded items box; this analysis
          uses them in their original direction (not recoded).
  - type: CollapseBox
    label: Centrality and network stability
    collapsed: true
    children:
      - type: Label
        label: Centrality
        children:
          - type: CheckBox
            name: runCentrality
          - type: CheckBox
            name: cenStandardize
            enable: (runCentrality)
          - type: CheckBox
            name: cenClosBetw
            enable: (runCentrality || runBootnet)
          - type: CheckBox
            name: showCenPlot
            enable: (runCentrality)
      - type: Label
        label: Stability (bootnet)
        children:
          - type: CheckBox
            name: runBootnet
          - type: TextBox
            name: bnIter
            format: number
            enable: (runBootnet)
          - type: TextBox
            name: bnCaseIter
            format: number
            enable: (runBootnet)
          - type: TextBox
            name: bnSeed
            format: number
            enable: (runBootnet)
          - type: CheckBox
            name: showEdgeCIPlot
            enable: (runBootnet)
          - type: CheckBox
            name: showCasePlot
            enable: (runBootnet)
  - type: CollapseBox
    label: Group comparison
    collapsed: true
    children:
      - type: Label
        label: 'Independent groups: the variable that defines them (e.g. sex).'
      - type: Label
        label: 'Same people measured twice (NCT only): the second measurement'
      - type: Label
        label: of the same items, in the same order as the items.
      - type: VariableSupplier
        persistentItems: false
        stretchFactor: 1
        children:
          - type: TargetLayoutBox
            label: Grouping variable
            children:
              - type: VariablesListBox
                name: group
                maxItemCount: 1
                isTarget: true
          - type: TargetLayoutBox
            label: Same items, second measurement
            children:
              - type: VariablesListBox
                name: pairedVars
                isTarget: true
                height: small
      - type: Label
        label: Invariance (independent groups)
        children:
          - type: CheckBox
            name: runInvariance
          - type: ComboBox
            name: invStructure
            enable: (runInvariance)
          - type: TextBox
            name: invConfigCut
            format: number
            enable: (runInvariance && invStructure:configural)
          - type: TextBox
            name: invIter
            format: number
            enable: (runInvariance)
          - type: CheckBox
            name: showInvPlot
            enable: (runInvariance)
      - type: Label
        label: Network Comparison Test
        children:
          - type: CheckBox
            name: runNCT
          - type: TextBox
            name: nctIter
            format: number
            enable: (runNCT)
          - type: ComboBox
            name: nctCorr
            enable: (runNCT)
          - type: CheckBox
            name: nctEdges
            enable: (runNCT)
          - type: CheckBox
            name: nctCentrality
            enable: (runNCT)
          - type: ComboBox
            name: nctAdjust
            enable: (runNCT && (nctEdges || nctCentrality))
      - type: TextBox
        name: groupSeed
        format: number
        enable: (runInvariance || runNCT)
  - type: CollapseBox
    label: Redundancy (UVA)
    collapsed: true
    children:
      - type: CheckBox
        name: runUVA
      - type: TextBox
        name: uvaCut
        format: number
        enable: (runUVA)
  - type: CollapseBox
    label: Stability (bootstrap)
    collapsed: true
    children:
      - type: CheckBox
        name: runBoot
      - type: ComboBox
        name: bootType
        enable: (runBoot)
      - type: TextBox
        name: iter
        format: number
        enable: (runBoot)
      - type: TextBox
        name: seed
        format: number
        enable: (runBoot)
      - type: TextBox
        name: stabilityCut
        format: number
        enable: (runBoot)
      - type: CheckBox
        name: showItemPlot
        enable: (runBoot)
      - type: CheckBox
        name: showFrequencyPlot
        enable: (runBoot)
  - type: CollapseBox
    label: Confirmatory factor analysis
    collapsed: true
    children:
      - type: CheckBox
        name: runCFA
      - type: ComboBox
        name: cfaEstimator
        enable: (runCFA)
      - type: CheckBox
        name: splitSample
        enable: (runCFA)
      - type: TextBox
        name: splitProp
        format: number
        enable: (runCFA && splitSample)
      - type: TextBox
        name: splitSeed
        format: number
        enable: (runCFA && splitSample)
      - type: Output
        name: splitOV
        enable: (runCFA && splitSample)
  - type: CollapseBox
    label: Output
    collapsed: true
    children:
      - type: CheckBox
        name: showChoicesGuide
      - type: CheckBox
        name: showLoadings
      - type: CheckBox
        name: showEdgeTable
      - type: CheckBox
        name: showNetworkPlot
      - type: ComboBox
        name: plotPalette
  - type: CollapseBox
    label: Network plot
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        cell:
          column: 0
          row: 0
        children:
          - type: Label
            label: Layout
            children:
              - type: ComboBox
                name: layout
              - type: TextBox
                name: plotTitle
                format: string
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        cell:
          column: 1
          row: 0
        children:
          - type: Label
            label: Nodes and labels
            children:
              - type: TextBox
                name: nodeSize
                format: number
              - type: ComboBox
                name: nodeShape
              - type: TextBox
                name: nodeAlpha
                format: number
              - type: TextBox
                name: labelSize
                format: number
              - type: ComboBox
                name: labelColor
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        cell:
          column: 0
          row: 1
        children:
          - type: Label
            label: Edges
            children:
              - type: TextBox
                name: edgeSize
                format: number
              - type: ComboBox
                name: edgePosColor
              - type: ComboBox
                name: edgeNegColor
              - type: ComboBox
                name: edgeNegLty
              - type: TextBox
                name: edgeMin
                format: number
              - type: CheckBox
                name: showEdgeLabels
              - type: TextBox
                name: edgeLabelSize
                format: number
                enable: (showEdgeLabels)
              - type: TextBox
                name: edgeLabelDigits
                format: number
                enable: (showEdgeLabels)
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        cell:
          column: 1
          row: 1
        children:
          - type: Label
            label: Legend
            children:
              - type: CheckBox
                name: showLegend
              - type: ComboBox
                name: legendPosition
                enable: (showLegend)
              - type: TextBox
                name: legendTitle
                format: string
                enable: (showLegend)
  - type: CollapseBox
    label: Hierarchical structure plot
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        cell:
          column: 0
          row: 0
        children:
          - type: Label
            label: Available when Hierarchical EGA is ticked.
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        cell:
          column: 0
          row: 1
        children:
          - type: Label
            label: Text
            children:
              - type: TextBox
                name: hierPlotTitle
                format: string
                enable: (runHier)
              - type: CheckBox
                name: hierShowLevels
                enable: (runHier)
              - type: CheckBox
                name: hierItemLabels
                enable: (runHier)
              - type: TextBox
                name: hierItemLabelSize
                format: number
                enable: (runHier && hierItemLabels)
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        cell:
          column: 1
          row: 1
        children:
          - type: Label
            label: Nodes and edges
            children:
              - type: TextBox
                name: hierItemSize
                format: number
                enable: (runHier)
              - type: TextBox
                name: hierDimSize
                format: number
                enable: (runHier)
              - type: TextBox
                name: hierEdgeWidth
                format: number
                enable: (runHier)
              - type: ComboBox
                name: hierEdgeColor
                enable: (runHier)
