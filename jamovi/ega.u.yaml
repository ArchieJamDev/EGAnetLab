title: Exploratory Graph Analysis
name: ega
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Items
        children:
          - type: VariablesListBox
            name: vars
            isTarget: true
  - type: CollapseBox
    label: Report Language
    collapsed: false
    children:
      - type: ComboBox
        name: reportLang
  - type: CollapseBox
    label: Estimation
    collapsed: true
    children:
      - type: ComboBox
        name: corr
      - type: ComboBox
        name: naData
      - type: ComboBox
        name: model
      - type: ComboBox
        name: algorithm
      - type: ComboBox
        name: uniMethod
  - type: CollapseBox
    label: Redundancy (UVA)
    collapsed: true
    children:
      - type: CheckBox
        name: runUVA
      - type: TextBox
        name: uvaCut
        format: number
        enable: (runUVA)
  - type: CollapseBox
    label: Stability (bootstrap)
    collapsed: true
    children:
      - type: CheckBox
        name: runBoot
      - type: ComboBox
        name: bootType
        enable: (runBoot)
      - type: TextBox
        name: iter
        format: number
        enable: (runBoot)
      - type: TextBox
        name: seed
        format: number
        enable: (runBoot)
      - type: TextBox
        name: stabilityCut
        format: number
        enable: (runBoot)
      - type: CheckBox
        name: showItemPlot
        enable: (runBoot)
      - type: CheckBox
        name: showFrequencyPlot
        enable: (runBoot)
  - type: CollapseBox
    label: Output
    collapsed: true
    children:
      - type: CheckBox
        name: showChoicesGuide
      - type: CheckBox
        name: showLoadings
      - type: CheckBox
        name: showNetworkPlot
      - type: ComboBox
        name: plotPalette
  - type: CollapseBox
    label: Plot Layout
    collapsed: true
    children:
      - type: ComboBox
        name: layout
      - type: TextBox
        name: plotTitle
        format: string
  - type: CollapseBox
    label: Plot Nodes and Labels
    collapsed: true
    children:
      - type: TextBox
        name: nodeSize
        format: number
      - type: ComboBox
        name: nodeShape
      - type: TextBox
        name: nodeAlpha
        format: number
      - type: TextBox
        name: labelSize
        format: number
      - type: ComboBox
        name: labelColor
  - type: CollapseBox
    label: Plot Edges
    collapsed: true
    children:
      - type: TextBox
        name: edgeSize
        format: number
      - type: ComboBox
        name: edgePosColor
      - type: ComboBox
        name: edgeNegColor
      - type: ComboBox
        name: edgeNegLty
      - type: TextBox
        name: edgeMin
        format: number
      - type: CheckBox
        name: showEdgeLabels
      - type: TextBox
        name: edgeLabelSize
        format: number
        enable: (showEdgeLabels)
      - type: TextBox
        name: edgeLabelDigits
        format: number
        enable: (showEdgeLabels)
  - type: CollapseBox
    label: Plot Legend
    collapsed: true
    children:
      - type: CheckBox
        name: showLegend
      - type: ComboBox
        name: legendPosition
        enable: (showLegend)
      - type: TextBox
        name: legendTitle
        format: string
        enable: (showLegend)
