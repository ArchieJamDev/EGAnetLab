title: Exploratory Graph Analysis
name: ega
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Items
        children:
          - type: VariablesListBox
            name: vars
            isTarget: true
  - type: CollapseBox
    label: Report Language
    collapsed: false
    children:
      - type: ComboBox
        name: reportLang
  - type: CollapseBox
    label: Estimation
    collapsed: true
    children:
      - type: ComboBox
        name: corr
      - type: ComboBox
        name: naData
      - type: ComboBox
        name: model
      - type: ComboBox
        name: algorithm
      - type: ComboBox
        name: uniMethod
  - type: CollapseBox
    label: Output
    collapsed: true
    children:
      - type: CheckBox
        name: showLoadings
      - type: CheckBox
        name: showNetworkPlot
      - type: ComboBox
        name: plotPalette
