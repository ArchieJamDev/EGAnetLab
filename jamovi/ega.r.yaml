  # ---------------------------------------------------------------------------
  # Stability (bootstrap): shown only when "Run bootstrap" is ticked.
  # ES: Estabilidad (bootstrap): se muestra solo si se marca "Run bootstrap".
  # ---------------------------------------------------------------------------

  # Holds the cached bootstrap summary in its state; cleared only when an
  # option that changes the computation changes (ARCHITECTURE.md §16).
  # ES: Guarda en su estado el resumen del bootstrap; se limpia solo cuando
  # cambia una opción que altera el cálculo (ARCHITECTURE.md §16).
  - name: bootStatus
    title: Bootstrap status
    type: Html
    visible: (runBoot)
    clearWith:
      - vars
      - negItems
      - negCoding
      - corr
      - naData
      - model
      - algorithm
      - uniMethod
      - bootType
      - iter
      - seed

  - name: bootSummaryGuide
    title: Number of dimensions across samples
    type: Html
    visible: (runBoot)

  - name: bootSummary
    title: Number of dimensions across samples
    type: Table
    visible: (runBoot)
    rows: 0
    refs:
      - christensen_2021_boot
      - golino_2017
      - eganet
    clearWith:
      - vars
      - negItems
      - negCoding
      - corr
      - naData
      - model
      - algorithm
      - uniMethod
      - bootType
      - iter
      - seed
      - reportLang
    columns:
      - name: element
        title: Element
        type: text
      - name: value
        title: Value
        type: text

  - name: bootFrequency
    title: Frequency of the number of dimensions
    type: Table
    visible: (runBoot)
    rows: 0
    clearWith:
      - vars
      - negItems
      - negCoding
