name: ega
title: Exploratory Graph Analysis
jrs: '1.1'

items:
  - name: intro
    title: Introduction
    type: Html

  - name: choicesGuide
    title: About your choices
    type: Html
    visible: (showChoicesGuide)

  - name: summaryGuide
    title: Dimensional structure
    type: Html

  - name: summary
    title: Dimensional structure
    type: Table
    rows: 0
    refs:
      - golino_2017
      - golino_2020
      - golino_2021
      - eganet
    clearWith:
      - vars
      - negItems
      - negCoding
      - corr
      - naData
      - model
      - algorithm
      - uniMethod
      - reportLang
    columns:
      - name: element
        title: Element
        type: text
      - name: value
        title: Value
        type: text

  - name: membership
    title: Item membership
    type: Table
    rows: 0
    refs:
      - golino_2017
    clearWith:
      - vars
      - negItems
      - negCoding
      - corr
      - naData
      - model
      - algorithm
      - uniMethod
      - reportLang
    columns:
      - name: item
        title: Item
        type: text
      - name: dimension
        title: Dimension
        type: text

  - name: loadingsGuide
    title: Network loadings
    type: Html
    visible: (showLoadings)

  - name: loadings
    title: Network loadings (standardized)
    type: Table
    rows: 0
    visible: (showLoadings)
    refs:
      - christensen_2021_loadings
    clearWith:
      - vars
      - negItems
      - negCoding
      - corr
      - naData
      - model
      - algorithm
      - uniMethod
      - reportLang
    columns:
      - name: item
        title: Item
        type: text

  - name: interpretation
    title: Applied interpretation
    type: Html

  - name: edgeTable
    title: Network connections
    type: Table
    rows: 0
    visible: (showEdgeTable)
    clearWith:
      - vars
      - negItems
      - negCoding
      - corr
      - naData
      - model
      - algorithm
      - uniMethod
      - reportLang
    columns:
      - name: item1
        title: Item
        type: text
      - name: item2
        title: Item
        type: text
      - name: weight
        title: Weight
        type: number
        format: zto
      - name: relation
        title: Dimensions
        type: text

  - name: networkPlot
    title: Estimated network
    type: Image
    width: 600
    height: 500
    renderFun: .plotNetwork
    visible: (showNetworkPlot)
    clearWith:
      - runHier
      - vars
      - negItems
      - negCoding
      - corr
      - naData
      - model
      - algorithm
      - uniMethod
      - plotPalette
      - layout
      - plotTitle
      - nodeSize
      - nodeShape
      - nodeAlpha
      - labelSize
      - labelColor
      - edgeSize
      - edgePosColor
      - edgeNegColor
      - edgeNegLty
      - edgeMin
      - showEdgeLabels
      - edgeLabelSize
      - edgeLabelDigits
      - showLegend
      - legendPosition
      - legendTitle

  # ---------------------------------------------------------------------------
  # Network scores.
  # ES: Puntuaciones de red.
  # ---------------------------------------------------------------------------

  - name: scoresGuide
    title: Network scores
    type: Html
    visible: (netScores)

  - name: scores
    title: Network scores
    type: Table
    rows: 0
    visible: (netScores)
    refs:
      - christensen_2021_loadings
    clearWith:
      - vars
      - negItems
      - negCoding
      - corr
      - naData
      - model
      - algorithm
      - uniMethod
      - reportLang
    columns:
      - name: dimension
        title: Dimension
        type: text
      - name: items
        title: Items
        type: integer
      - name: n
        title: N
        type: integer
      - name: mean
        title: Mean
        type: number
      - name: sd
        title: SD
        type: number
      - name: rMean
        title: r with mean score
        type: number
        format: zto

  - name: netScoresOV
    title: Network scores
    type: Output
    initInRun: true
    measureType: continuous
    clearWith:
      - vars
      - negItems
      - negCoding
      - corr
      - naData
      - model
      - algorithm
      - uniMethod

  - name: meanScoresOV
    title: Item means
    type: Output
    initInRun: true
    measureType: continuous
    clearWith:
      - vars
      - negItems
      - negCoding
      - corr
      - naData
      - model
      - algorithm
      - uniMethod

  # ---------------------------------------------------------------------------
  # Compare structures (TEFI): shown only when "Compare structures with
  # TEFI" is ticked.
  # ES: Comparar estructuras (TEFI): se muestra solo si se marca "Compare
  # structures with TEFI".
  # ---------------------------------------------------------------------------

  - name: compareStatus
    title: Compare structures (TEFI)
    type: Html
    visible: (runCompare)

  - name: compareTable
    title: Structures compared
    type: Table
    rows: 0
    visible: (runCompare)
    refs:
      - golino_2021
    clearWith:
      - vars
      - negItems
      - negCoding
      - corr
      - naData
      - model
      - algorithm
      - uniMethod
      - compareAlgorithms
      - theoryFactors
      - compareCFA
      - reportLang
    columns:
      - name: structure
        title: Structure
        type: text
      - name: dims
        title: Dimensions
        type: integer
      - name: tefi
        title: TEFI
        type: number
      - name: delta
        title: Difference from lowest
        type: number
      - name: agree
        title: Items placed as in EGA
        type: text
      - name: cfi
        title: CFI
        type: number
        format: zto
        visible: (compareCFA)
      - name: rmsea
        title: RMSEA
        type: number
        format: zto
        visible: (compareCFA)
      - name: srmr
        title: SRMR
        type: number
        format: zto
        visible: (compareCFA)

  - name: compareMembership
    title: Item membership by structure
    type: Table
    rows: 0
    visible: (runCompare)
    clearWith:
      - vars
      - negItems
      - negCoding
      - corr
      - naData
      - model
      - algorithm
      - uniMethod
      - compareAlgorithms
      - theoryFactors
      - compareCFA
      - reportLang
