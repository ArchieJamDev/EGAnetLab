        title: Dimensions
        type: integer
      - name: count
        title: Samples
        type: integer
      - name: proportion
        title: Proportion
        type: number
        format: zto

  - name: bootDimStability
    title: Dimension stability
    type: Table
    visible: (runBoot)
    rows: 0
    refs:
      - christensen_2021_boot
    clearWith:
      - vars
      - negItems
      - negCoding
      - corr
      - naData
      - model
      - algorithm
      - uniMethod
      - bootType
      - iter
      - seed
      - reportLang
    columns:
