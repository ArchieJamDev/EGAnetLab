name: ega
title: Exploratory Graph Analysis
jrs: '1.1'

items:
  - name: intro
    title: Introduction
    type: Html

  - name: choicesGuide
    title: About your choices
    type: Html
    visible: (showChoicesGuide)

  - name: summaryGuide
    title: Dimensional structure
    type: Html

  - name: summary
    title: Dimensional structure
    type: Table
    rows: 0
    refs:
      - golino_2017
      - golino_2020
      - golino_2021
      - eganet
    clearWith:
      - vars
      - corr
      - naData
      - model
      - algorithm
      - uniMethod
      - reportLang
    columns:
      - name: element
        title: Element
        type: text
      - name: value
        title: Value
        type: text

  - name: membership
    title: Item membership
    type: Table
    rows: 0
    refs:
      - golino_2017
    clearWith:
      - vars
      - corr
      - naData
      - model
      - algorithm
      - uniMethod
      - reportLang
    columns:
      - name: item
        title: Item
        type: text
      - name: dimension
        title: Dimension
        type: text

  - name: loadingsGuide
    title: Network loadings
    type: Html
    visible: (showLoadings)

  - name: loadings
    title: Network loadings (standardized)
    type: Table
    rows: 0
    visible: (showLoadings)
    refs:
      - christensen_2021_loadings
    clearWith:
      - vars
      - corr
      - naData
      - model
      - algorithm
      - uniMethod
      - reportLang
    columns:
      - name: item
        title: Item
        type: text

  - name: interpretation
    title: Applied interpretation
    type: Html

  - name: networkPlot
    title: Estimated network
    type: Image
    width: 600
    height: 500
    renderFun: .plotNetwork
    visible: (showNetworkPlot)
    clearWith:
      - vars
      - corr
      - naData
      - model
      - algorithm
      - uniMethod
      - plotPalette
      - layout
      - plotTitle
      - nodeSize
      - nodeShape
      - nodeAlpha
      - labelSize
      - labelColor
      - edgeSize
      - edgePosColor
      - edgeNegColor
      - edgeNegLty
      - edgeMin
      - showEdgeLabels
      - edgeLabelSize
      - edgeLabelDigits
      - showLegend
      - legendPosition
      - legendTitle

  # ---------------------------------------------------------------------------
  # Redundancy (UVA): shown only when "Check redundancy (UVA)" is ticked.
  # ES: Redundancia (UVA): se muestra solo si se marca "Check redundancy
  # (UVA)".
  # ---------------------------------------------------------------------------

  - name: uvaStatus
    title: Redundancy (UVA)
    type: Html
    visible: (runUVA)

  - name: uvaPairs
    title: Item pairs by weighted topological overlap
    type: Table
    rows: 0
    visible: (runUVA)
    refs:
      - christensen_2023_uva
    clearWith:
      - vars
      - corr
      - naData
      - model
      - algorithm
      - uniMethod
      - uvaCut
      - reportLang
    columns:
      - name: itemA
        title: Item
        type: text
      - name: itemB
        title: Item
        type: text
      - name: wto
        title: wTO
        type: number
        format: zto
      - name: magnitude
        title: Redundancy
        type: text
      - name: sameDim
        title: Same dimension
        type: text

  - name: uvaSets
    title: Redundant sets
    type: Table
    rows: 0
    visible: (runUVA)
    refs:
      - christensen_2023_uva
    clearWith:
      - vars
      - corr
      - naData
      - model
      - algorithm
      - uniMethod
      - uvaCut
      - reportLang
    columns:
      - name: set
        title: Set
        type: integer
      - name: items
        title: Items
        type: text
      - name: keep
        title: Suggested to keep
        type: text
      - name: remove
        title: Suggested to remove
        type: text

  - name: uvaInterpretation
    title: Redundancy interpretation
    type: Html
    visible: (runUVA)

  # ---------------------------------------------------------------------------
  # Stability (bootstrap): shown only when "Run bootstrap" is ticked.
  # ES: Estabilidad (bootstrap): se muestra solo si se marca "Run bootstrap".
  # ---------------------------------------------------------------------------

  # Holds the cached bootstrap summary in its state; cleared only when an
  # option that changes the computation changes (ARCHITECTURE.md §16).
  # ES: Guarda en su estado el resumen del bootstrap; se limpia solo cuando
  # cambia una opción que altera el cálculo (ARCHITECTURE.md §16).
  - name: bootStatus
    title: Bootstrap status
    type: Html
    visible: (runBoot)
    clearWith:
      - vars
      - corr
      - naData
      - model
      - algorithm
      - uniMethod
      - bootType
      - iter
      - seed

  - name: bootSummaryGuide
    title: Number of dimensions across samples
    type: Html
    visible: (runBoot)

  - name: bootSummary
    title: Number of dimensions across samples
    type: Table
    visible: (runBoot)
    rows: 0
    refs:
      - christensen_2021_boot
      - golino_2017
      - eganet
    clearWith:
      - vars
      - corr
      - naData
      - model
      - algorithm
      - uniMethod
      - bootType
      - iter
      - seed
      - reportLang
    columns:
      - name: element
        title: Element
        type: text
      - name: value
        title: Value
        type: text

  - name: bootFrequency
    title: Frequency of the number of dimensions
    type: Table
    visible: (runBoot)
    rows: 0
    clearWith:
      - vars
      - corr
      - naData
      - model
      - algorithm
      - uniMethod
      - bootType
      - iter
      - seed
      - reportLang
    columns:
      - name: dims
        title: Dimensions
        type: integer
      - name: count
        title: Samples
        type: integer
      - name: proportion
        title: Proportion
        type: number
        format: zto

  - name: bootDimStability
    title: Dimension stability
    type: Table
    visible: (runBoot)
    rows: 0
    refs:
      - christensen_2021_boot
    clearWith:
      - vars
      - corr
      - naData
      - model
      - algorithm
      - uniMethod
      - bootType
      - iter
      - seed
      - reportLang
    columns:
      - name: dimension
        title: Dimension
        type: text
      - name: items
        title: Items
        type: integer
      - name: consistency
        title: Structural consistency
        type: number
        format: zto
      - name: meanItem
        title: Mean item stability
        type: number
        format: zto

  - name: bootItemStability
    title: Item stability
    type: Table
    visible: (runBoot)
    rows: 0
    refs:
      - christensen_2021_boot
    clearWith:
      - vars
      - corr
      - naData
      - model
      - algorithm
      - uniMethod
      - bootType
      - iter
      - seed
      - reportLang
      - stabilityCut
    columns:
      - name: item
        title: Item
        type: text
      - name: dimension
        title: Dimension
        type: text
      - name: stability
        title: Stability
        type: number
        format: zto
      - name: flag
        title: Assessment
        type: text

  - name: bootInterpretation
    title: Stability interpretation
    type: Html
    visible: (runBoot)

  - name: bootItemPlot
    title: Item stability
    type: Image
    width: 600
    height: 450
    renderFun: .plotBootItems
    visible: (runBoot && showItemPlot)
    clearWith:
      - vars
      - corr
      - naData
      - model
      - algorithm
      - uniMethod
      - bootType
      - iter
      - seed
      - stabilityCut
      - reportLang
      - plotPalette

  - name: bootFrequencyPlot
    title: Frequency of the number of dimensions
    type: Image
    width: 550
    height: 400
    renderFun: .plotBootFrequency
    visible: (runBoot && showFrequencyPlot)
    clearWith:
      - vars
      - corr
      - naData
      - model
      - algorithm
      - uniMethod
      - bootType
      - iter
      - seed
      - reportLang
      - plotPalette

  - name: notes
    title: Notes
    type: Html
...
