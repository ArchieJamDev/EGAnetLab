name: dynega
title: Dynamic EGA
menuGroup: EGAnet Lab
menuSubgroup: Dimensionality
menuTitle: Dynamic EGA (intensive longitudinal data)
version: '0.1.0'
jas: '1.2'

description:
    main: >
      Estimates the dimensional structure of intensive longitudinal data
      (many measurements per person) with dynamic Exploratory Graph Analysis:
      derivatives of each person's time series, and their structure for the
      whole sample, for each group and for each person, with plain-language
      interpretation.

options:
  - name: data
    type: Data

  # Items measured repeatedly, one row per person and time point (long
  # format).
  # ES: Ítems medidos repetidamente, una fila por persona y momento (formato
  # largo).
  - name: vars
    title: Items
    type: Variables
    suggested:
      - continuous
      - ordinal
    permitted:
      - numeric

  - name: id
    title: Person ID
    type: Variable
    default: null

  # Optional: rows are ordered by this variable within each person; without
  # it, the order of the rows in the data is used.
  # ES: Opcional: las filas se ordenan por esta variable dentro de cada
  # persona; sin ella, se usa el orden de las filas en los datos.
  - name: time
    title: Time (order of measurements)
    type: Variable
    suggested:
      - continuous
      - ordinal
    permitted:
      - numeric
    default: null

  - name: group
    title: Grouping variable
    type: Variable
    suggested:
      - nominal
      - ordinal
    permitted:
      - factor
    default: null

  - name: reportLang
    title: Report Language
    type: List
    options:
      - title: English
        name: en
      - title: Español
        name: es
    default: en

  # Generalized local linear approximation (GLLA) of the derivatives.
  # ES: Aproximación lineal local generalizada (GLLA) de las derivadas.
  - name: nEmbed
    title: Embedding dimension (time points per window)
    type: Integer
    min: 3
    max: 30
    default: 5

  - name: tau
    title: Lag between time points (tau)
    type: Integer
    min: 1
    max: 10
    default: 1

  - name: delta
    title: Time between measurements (delta)
    type: Number
    min: 0.001
    default: 1

  - name: derivative
    title: Derivative analysed
    type: List
    options:
      - title: Level (0, the values themselves)
        name: '0'
      - title: Rate of change (1, first derivative)
        name: '1'
      - title: Acceleration (2, second derivative)
        name: '2'
    default: '1'

  - name: corr
    title: Correlation
    type: List
    options:
      - title: Automatic (Pearson / polychoric)
        name: auto
      - title: Pearson
        name: pearson
      - title: Spearman
        name: spearman
    default: auto

  - name: model
    title: Network Model
    type: List
    options:
      - title: GLASSO (EBIC)
        name: glasso
      - title: TMFG
        name: TMFG
      - title: BGGM
        name: BGGM
    default: glasso

  - name: algorithm
    title: Community Detection
    type: List
    options:
      - title: Walktrap
        name: walktrap
      - title: Louvain
        name: louvain
      - title: Leiden
        name: leiden
    default: walktrap

  - name: uniMethod
    title: Unidimensionality Check
    type: List
    options:
      - title: Louvain
        name: louvain
      - title: Expand
        name: expand
      - title: Leading eigenvalue
        name: LE
    default: louvain

  - name: seed
    title: Seed
    type: Integer
    min: 1
    max: 999999999
    default: 2026

  # Levels. Population is always estimated; groups need a grouping variable;
  # individual networks take longer and need many time points per person.
  # ES: Niveles. La población siempre se estima; los grupos necesitan una
  # variable de agrupación; las redes individuales tardan más y necesitan
  # muchos momentos por persona.
  - name: levelGroup
    title: Structure of each group
    type: Bool
    default: true

  - name: levelIndividual
    title: Structure of each person
    type: Bool
    default: false

  - name: showIndTable
    title: Table with every person
    type: Bool
    default: false

  - name: showChoicesGuide
    title: About your choices
    type: Bool
    default: true

  - name: showNetworkPlot
    title: Population network plot
    type: Bool
    default: true

  - name: showIndPlot
    title: Dimensions across persons plot
    type: Bool
    default: true

  - name: plotPalette
    title: Dimension Colors
    type: List
    options:
      - title: EGAnetLab default
        name: default
      - title: Colorblind-safe (Okabe-Ito)
        name: colorblind
      - title: Viridis
        name: viridis
    default: default

  # ---------------------------------------------------------------------------
  # Network plot customization. Defaults equal EGAnet's own plot.EGA()
  # defaults, so an untouched analysis draws the same plot as EGAnet. Every
  # option maps to a GGally::ggnet2 argument that plot.EGA() forwards
  # (ARCHITECTURE.md §10), except edgeMin and the edge labels, which
  # EGAnetLab applies itself.
  # ES: Personalización del gráfico de red. Los valores por defecto son los
  # de plot.EGA() de EGAnet, así que un análisis sin tocar dibuja el mismo
  # gráfico que EGAnet. Cada opción corresponde a un argumento de
  # GGally::ggnet2 que plot.EGA() reenvía (ARCHITECTURE.md §10), salvo
  # edgeMin y las etiquetas de aristas, que aplica EGAnetLab.
  # ---------------------------------------------------------------------------
  - name: layout
    title: Layout
    type: List
    options:
      - title: Spring (Fruchterman-Reingold)
        name: qgraph
      - title: Kamada-Kawai
        name: kamadakawai
      - title: Circle
        name: circle
      - title: Multidimensional scaling
        name: mds
      - title: Eigenvector
        name: eigen
    default: qgraph

  - name: plotTitle
    title: Plot title
    type: String
    default: ''

  - name: nodeSize
    title: Node size
    type: Number
    min: 2
    max: 30
    default: 12

  - name: nodeShape
    title: Node shape
    type: List
    options:
      - title: Circle
        name: circle
      - title: Square
        name: square
      - title: Triangle
        name: triangle
      - title: Diamond
        name: diamond
    default: circle

  - name: nodeAlpha
    title: Node fill opacity
    type: Number
    min: 0
    max: 1
    default: 0.5

  - name: labelSize
    title: Label size
    type: Number
    min: 1
    max: 15
    default: 5

  - name: labelColor
    title: Label color
    type: List
    options:
      - title: Black
        name: black
      - title: Dark gray
        name: grey30
      - title: Navy
        name: navy
      - title: White
        name: white
    default: black

  - name: edgeSize
    title: Edge width
    type: Number
    min: 1
    max: 20
    default: 8

  - name: edgePosColor
    title: Positive edges
    type: List
    options:
      - title: Dark green
        name: darkgreen
      - title: Blue
        name: blue
      - title: Black
        name: black
      - title: Gray
        name: grey50
    default: darkgreen

  - name: edgeNegColor
    title: Negative edges
    type: List
    options:
      - title: Red
        name: red
      - title: Orange
        name: orange
      - title: Dark red
        name: darkred
      - title: Gray
        name: grey50
    default: red

  - name: edgeNegLty
    title: Negative edge line
    type: List
    options:
      - title: Solid
        name: solid
      - title: Dashed
        name: dashed
      - title: Dotted
        name: dotted
    default: solid

  # Edges whose absolute weight is below this value are hidden from the
  # plot only; the estimated network, memberships and loadings are not
  # changed.
  # ES: Las aristas con peso absoluto menor a este valor se ocultan solo en
  # el gráfico; la red estimada, las pertenencias y las cargas no cambian.
  - name: edgeMin
    title: Hide edges weaker than
    type: Number
    min: 0
    max: 1
    default: 0

  - name: showEdgeLabels
    title: Show edge weights
    type: Bool
    default: false

  - name: edgeLabelSize
    title: Edge weight size
    type: Number
    min: 1
    max: 10
    default: 3

  - name: edgeLabelDigits
    title: Decimals
    type: Integer
    min: 1
    max: 3
    default: 2

  - name: showLegend
    title: Show legend
    type: Bool
    default: true

  - name: legendPosition
    title: Legend position
    type: List
    options:
      - title: Right
        name: right
      - title: Bottom
        name: bottom
      - title: Left
        name: left
      - title: Top
        name: top
    default: right

  - name: legendTitle
    title: Legend title
    type: String
    default: ''
...
