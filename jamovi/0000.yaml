---
name: EGAnetLab
title: EGAnet Lab
version: 0.1.0
jms: '1.0'
authors:
  - Arquímedes De León Chacón Chacón
maintainer: Arquímedes De León Chacón Chacón <arquimedeschacon@gmail.com>
description: >
  EGAnetLab brings the network psychometrics methods of the EGAnet package to
  jamovi and pairs every result with evidence-based methodological guidance,
  interpretation and educational support. It estimates the number and content of
  dimensions with Exploratory Graph Analysis and, in later releases, adds
  bootstrap stability, redundancy analysis (UVA), hierarchical, dynamic and
  invariance extensions. Every method-backed table cites its own source in
  jamovi's native numbered format, and the complete APA 7th edition bibliography
  lives in the module's documentation.
usesNative: false
minApp: 1.0.8
analyses:
  - title: Exploratory Graph Analysis
    name: ega
    ns: EGAnetLab
    menuGroup: EGAnet Lab
    menuSubgroup: Dimensionality
    menuTitle: Exploratory Graph Analysis
    description: >
      Estimates the number of dimensions underlying a set of items, and which
      items belong to each dimension, with Exploratory Graph Analysis (EGAnet),
      paired with network loadings, entropy fit and plain-language
      interpretation.
    category: analyses
  - title: Bootstrap EGA
    name: bootega
    ns: EGAnetLab
    menuGroup: EGAnet Lab
    menuSubgroup: Dimensionality
    menuTitle: Bootstrap EGA (stability)
    description: >
      Checks whether the dimensions found by Exploratory Graph Analysis
      replicate across bootstrap samples, with the distribution of the number of
      dimensions, the structural consistency of each dimension and the stability
      of each item's membership.
    category: analyses
datasets:
  - name: WMT-2 Matrices Test (n=1185)
    path: eganetlab_wmt2.csv
    description: >-
      Eighteen dichotomous items of the Wiener Matrizen-Test 2 plus demographic
      variables, from the EGAnet package - see data/README.md

