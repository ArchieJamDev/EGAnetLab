---
name: EGAnetLab
title: EGAnet Lab
version: 0.1.0
jms: '1.0'
authors:
  - Arquímedes De León Chacón Chacón
maintainer: Arquímedes De León Chacón Chacón <arquimedeschacon@gmail.com>
description: >
  EGAnetLab brings the network psychometrics methods of the EGAnet package to
  jamovi and pairs every result with evidence-based methodological guidance,
  interpretation and educational support. It estimates the number and content of
  dimensions with Exploratory Graph Analysis and, in later releases, adds
  bootstrap stability, redundancy analysis (UVA), hierarchical, dynamic and
  invariance extensions. Every method-backed table cites its own source in
  jamovi's native numbered format, and the complete APA 7th edition bibliography
  lives in the module's documentation.
usesNative: false
minApp: 1.0.8
analyses:
  - title: Exploratory Graph Analysis
    name: ega
    ns: EGAnetLab
    menuGroup: EGAnet Lab
    menuSubgroup: Dimensionality
    menuTitle: Exploratory Graph Analysis
    description: >
      Estimates the number of dimensions underlying a set of items, and which
      items belong to each dimension, with Exploratory Graph Analysis
      (EGAnetLab), paired with network loadings, entropy fit, optional bootstrap
      stability of dimensions and items, optional redundancy analysis (UVA), and
      plain-language interpretation.
    category: analyses
  - title: Dynamic EGA
    name: dynega
    ns: EGAnetLab
    menuGroup: EGAnet Lab
    menuSubgroup: Dimensionality
    menuTitle: Dynamic EGA (intensive longitudinal data)
    description: >
      Estimates the dimensional structure of intensive longitudinal data
      (many measurements per person) with dynamic Exploratory Graph Analysis:
      derivatives of each person's time series, and their structure for the
      whole sample, for each group and for each person, with plain-language
      interpretation.
    category: analyses
datasets:
  - name: WMT-2 Matrices Test (n=1185)
    path: eganetlab_wmt2.csv
    description: >-
      Eighteen dichotomous items of the Wiener Matrizen-Test 2 plus demographic
      variables, from the EGAnet package - see data/README.md
  - name: Simulated intensive longitudinal data (100 persons x 50 time points)
    path: eganetlab_dynamic_sim.csv
    description: >-
      Twenty-four items measured 50 times in 100 simulated persons in two
      groups (long format, with ID, Group and Time), from the EGAnet package
      - see data/README.md

