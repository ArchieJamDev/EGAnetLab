---
name: bootega
title: Bootstrap EGA
menuGroup: EGAnet Lab
menuSubgroup: Dimensionality
menuTitle: Bootstrap EGA (stability)
version: '0.1.0'
jas: '1.2'

description:
    main: >
      Checks whether the dimensions found by Exploratory Graph Analysis
      replicate across bootstrap samples, with the distribution of the number
      of dimensions, the structural consistency of each dimension and the
      stability of each item's membership.

options:
  - name: data
    type: Data

  # The items whose dimensional structure is estimated. EGA needs at least
  # three; the .b.R file rejects fewer (Category A).
  # ES: Los ítems cuya estructura dimensional se estima. EGA necesita al menos
  # tres; el .b.R rechaza menos (Categoría A).
  - name: vars
    title: Items
    type: Variables
    suggested:
      - continuous
      - ordinal
    permitted:
      - numeric

  - name: reportLang
    title: Report Language
    type: List
    options:
      - title: English
        name: en
      - title: Español
        name: es
    default: en

  # Correlation passed to EGAnet::EGA(corr =). "auto" lets EGAnet choose
  # polychoric/tetrachoric correlations for items with few categories; the
  # report states which items triggered that choice.
  # ES: Correlación pasada a EGAnet::EGA(corr =). "auto" deja que EGAnet elija
  # correlaciones policóricas/tetracóricas para ítems con pocas categorías;
  # el informe indica qué ítems motivaron esa elección.
  - name: corr
    title: Correlation
    type: List
    options:
      - title: Automatic (Pearson / polychoric)
        name: auto
      - title: Pearson
        name: pearson
      - title: Spearman
        name: spearman
      - title: Cosine
        name: cosine
    default: auto

  - name: naData
    title: Missing Values
    type: List
    options:
      - title: Pairwise
        name: pairwise
      - title: Listwise
        name: listwise
    default: pairwise

  - name: model
    title: Network Model
    type: List
    options:
      - title: GLASSO (EBIC)
        name: glasso
      - title: TMFG
        name: TMFG
      - title: BGGM
        name: BGGM
    default: glasso

  - name: algorithm
    title: Community Detection
    type: List
    options:
      - title: Walktrap
        name: walktrap
      - title: Louvain
        name: louvain
      - title: Leiden
        name: leiden
    default: walktrap

  - name: uniMethod
    title: Unidimensionality Check
    type: List
    options:
      - title: Louvain
        name: louvain
      - title: Expand
        name: expand
      - title: Leading eigenvalue
        name: LE
    default: louvain

  # ---------------------------------------------------------------------------
  # Bootstrap. Resampling takes minutes, so nothing runs until the user
  # ticks "Run bootstrap" (ARCHITECTURE.md §16). The seed is visible and
  # fixed by default so every result can be reproduced.
  # ES: Bootstrap. El remuestreo tarda minutos, así que nada se ejecuta hasta
  # que el usuario marca "Run bootstrap" (ARCHITECTURE.md §16). La semilla es
  # visible y fija por defecto para que todo resultado sea reproducible.
  # ---------------------------------------------------------------------------
  - name: runBoot
    title: Run bootstrap
    type: Bool
    default: false

  - name: bootType
    title: Bootstrap type
    type: List
    options:
      - title: Parametric
        name: parametric
      - title: Resampling (cases)
        name: resampling
    default: parametric

  - name: iter
    title: Bootstrap samples
    type: Integer
    min: 10
    max: 10000
    default: 500

  - name: seed
    title: Seed
    type: Integer
    min: 1
    max: 999999999
    default: 2026

  # Item stability below this proportion is flagged in the item table, the
  # plot and the interpretation.
  # ES: La estabilidad de ítem menor a esta proporción se señala en la tabla
  # de ítems, el gráfico y la interpretación.
  - name: stabilityCut
    title: Item stability cutoff
    type: Number
    min: 0.5
    max: 0.95
    default: 0.7

  - name: showChoicesGuide
    title: Explain my choices
    type: Bool
    default: true

  - name: showItemPlot
    title: Item stability plot
    type: Bool
    default: true

  - name: showFrequencyPlot
    title: Dimension frequency plot
    type: Bool
    default: true

  - name: plotPalette
    title: Dimension Colors
    type: List
    options:
      - title: jamovi theme
        name: jamovi
      - title: Colorblind-safe (Okabe-Ito)
        name: colorblind
      - title: Viridis
        name: viridis
    default: jamovi
...
